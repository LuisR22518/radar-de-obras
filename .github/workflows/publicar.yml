# Canal de datos automatizado: cada hora lee el registro de obras desde la hoja de Google,
# recalcula LupIA y publica el sitio. También corre con cada cambio en el repositorio.
name: Recalcular y publicar LupIA

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch: {}

permissions:
  contents: write   # para guardar en el repositorio los cambios que el gestor hizo en la hoja
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Leer el registro de obras desde la hoja de Google
        run: python scripts/registro.py
      - name: Guardar en el repositorio los cambios del registro (con su bitácora)
        run: |
          if [ -n "$(git status --porcelain datos/registro)" ]; then
            git config user.name "LupIA (registro)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/registro
            git commit -m "Registro de obras: cambios del gestor desde la hoja"
            git pull --rebase
            git push
          fi
      - name: Obras simuladas a partir del piloto real y lluvia de Open-Meteo
        run: |
          python scripts/generar_simulados.py
          python scripts/clima.py
      - name: Calcular y validar (si una prueba falla, no se publica)
        run: |
          python scripts/construir.py
          python scripts/validar.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
